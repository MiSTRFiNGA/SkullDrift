<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ember Drift — everyone flies the same canyon today</title>
<meta name="description" content="One button. A living firestorm canyon. Everyone on Earth flies the identical course today — beat your friends' scores before it resets.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0508; touch-action:none;
              font-family:'Segoe UI', system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  #game { display:block; width:100vw; height:100vh; }
  .ui { position:fixed; color:#ffd9a0; text-shadow:0 0 12px #ff6a00, 0 0 30px #ff3300; z-index:5; }
  #hud { top:12px; left:16px; font-size:clamp(18px,3vw,28px); font-weight:700; letter-spacing:1px; }
  #combo { top:12px; left:50%; transform:translateX(-50%); font-size:clamp(14px,2.4vw,22px);
           opacity:0; transition:opacity .2s; font-weight:600; color:#ffe9c0; }
  #mute { top:10px; right:14px; font-size:clamp(20px,3vw,26px); cursor:pointer; opacity:.85; padding:6px 10px;
          background:rgba(30,10,5,.45); border:1px solid rgba(255,120,40,.35); border-radius:10px; backdrop-filter:blur(4px); }
  #overlay { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:radial-gradient(ellipse at center, rgba(20,6,2,.55) 0%, rgba(5,2,1,.88) 100%); text-align:center; padding:20px; }
  #overlay h1 { font-size:clamp(38px,9vw,84px); font-weight:900; letter-spacing:4px; color:#ffedd0;
                text-shadow:0 0 18px #ff7a00, 0 0 60px #ff3c00, 0 0 120px #b31c00; margin-bottom:6px; }
  #overlay .tag { font-size:clamp(13px,2.4vw,18px); color:#ffb877; margin-bottom:22px; letter-spacing:1px; }
  #overlay .big { font-size:clamp(20px,4vw,34px); margin:4px 0; font-weight:700; }
  #overlay .stats { display:flex; gap:26px; margin:14px 0 8px; flex-wrap:wrap; justify-content:center; }
  #overlay .stat { background:rgba(40,14,4,.55); border:1px solid rgba(255,130,40,.3); border-radius:14px;
                   padding:10px 20px; min-width:110px; }
  #overlay .stat .v { font-size:clamp(22px,4.4vw,36px); font-weight:800; color:#fff1dc; }
  #overlay .stat .l { font-size:clamp(10px,1.7vw,13px); color:#ff9d5c; letter-spacing:2px; text-transform:uppercase; }
  #overlay .go { margin-top:18px; font-size:clamp(16px,3vw,24px); padding:14px 44px; border-radius:40px;
                 background:linear-gradient(180deg,#ff8c1a,#e03500); color:#fff; border:none; cursor:pointer;
                 font-weight:800; letter-spacing:2px; box-shadow:0 0 30px rgba(255,90,0,.6), inset 0 2px 0 rgba(255,255,255,.35); }
  #overlay .go:active { transform:scale(.96); }
  #overlay .share { margin-top:12px; font-size:clamp(12px,2.2vw,16px); padding:9px 26px; border-radius:30px;
                    background:rgba(50,18,6,.6); color:#ffcf9e; border:1px solid rgba(255,140,60,.45); cursor:pointer; letter-spacing:1px; }
  #overlay .hint { margin-top:16px; font-size:clamp(11px,2vw,14px); color:#c97a45; }
  #overlay .daily { margin-top:8px; font-size:clamp(11px,2vw,14px); color:#ffab66; }
  #toast { bottom:9vh; left:50%; transform:translateX(-50%); background:rgba(40,14,4,.85); padding:10px 22px;
           border-radius:24px; border:1px solid rgba(255,140,60,.5); font-size:14px; opacity:0; transition:opacity .3s; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui" id="hud"></div>
<div class="ui" id="combo"></div>
<div class="ui" id="mute" title="mute">🔊</div>
<div class="ui" id="toast"></div>

<div class="ui" id="overlay">
  <h1>EMBER DRIFT</h1>
  <div class="tag">Everyone on Earth flies the <b>same canyon</b> today. New canyon at midnight UTC.</div>
  <div id="resultBlock" class="hidden">
    <div class="big" id="scoreLine"></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="v" id="stBest">0</div><div class="l">Today's best</div></div>
    <div class="stat"><div class="v" id="stAll">0</div><div class="l">All-time</div></div>
    <div class="stat"><div class="v" id="stStreak">0🔥</div><div class="l">Day streak</div></div>
  </div>
  <button class="go" id="btnGo">IGNITE</button>
  <button class="share hidden" id="btnShare">⚡ Challenge a friend</button>
  <div class="hint">HOLD to rise · release to fall · graze the rock for bonus embers</div>
  <div class="daily" id="daily"></div>
</div>

<script>
"use strict";
/* ============================================================
   EMBER DRIFT — one-input daily-canyon arcade.
   No backend. Daily seed = UTC date, so the whole world races
   the identical course. localStorage keeps bests + streak.
   ============================================================ */
const cv = document.getElementById('game'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width  = Math.floor(innerWidth  * DPR);
  H = cv.height = Math.floor(innerHeight * DPR);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
}
addEventListener('resize', resize); resize();

/* ---------- daily seed ---------- */
function utcDayKey(){ const d = new Date(); return d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate(); }
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a);
  t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function msToReset(){ const n = new Date(); const nxt = Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1);
  return nxt - n.getTime(); }

/* ---------- persistence ---------- */
const store = {
  get k(){ return 'emberdrift_' + utcDayKey(); },
  load(){
    let all = +localStorage.ed_all || 0;
    let today = +localStorage[this.k] || 0;
    let streak = +localStorage.ed_streak || 0, last = +localStorage.ed_lastday || 0;
    const dk = utcDayKey();
    // streak: consecutive UTC days with at least one run
    if (last !== dk && last !== dk - 1 && !(last && sameOrAdjacentDay(last, dk))) streak = last ? 0 : streak;
    return { all, today, streak, last };
  },
  save(score){
    const dk = utcDayKey();
    const t = +localStorage[this.k] || 0;
    if (score > t) localStorage[this.k] = score;
    if (score > (+localStorage.ed_all || 0)) localStorage.ed_all = score;
    const last = +localStorage.ed_lastday || 0;
    let streak = +localStorage.ed_streak || 0;
    if (last !== dk) { streak = adjacentDay(last, dk) ? streak + 1 : 1; localStorage.ed_streak = streak; localStorage.ed_lastday = dk; }
  }
};
function adjacentDay(a, b){ if (!a) return false;
  const pa = new Date(Date.UTC(Math.floor(a/10000), Math.floor(a/100)%100 - 1, a%100));
  const pb = new Date(Date.UTC(Math.floor(b/10000), Math.floor(b/100)%100 - 1, b%100));
  return (pb - pa) === 86400000; }
function sameOrAdjacentDay(a,b){ return a === b || adjacentDay(a,b); }

/* ---------- audio (synth, zero assets) ---------- */
let AC = null, muted = localStorage.ed_mute === '1';
function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function beep(f, dur, type, vol, slide){
  if (muted) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + dur);
    g.gain.value = vol || .08; g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  } catch(e){}
}
const sfx = {
  flap(){ beep(240, .09, 'triangle', .05, 330); },
  near(c){ beep(660 + c*80, .12, 'sine', .09, 880 + c*80); },
  gate(){ beep(420, .07, 'square', .035, 500); },
  die(){ beep(160, .5, 'sawtooth', .14, 40); beep(90, .7, 'triangle', .1, 30); },
  best(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sine',.1),i*90)); }
};
const muteBtn = document.getElementById('mute');
function drawMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.onclick = (e)=>{ e.stopPropagation(); muted = !muted; localStorage.ed_mute = muted ? '1':'0'; drawMute(); };
drawMute();

/* ---------- game state ---------- */
const S = { MENU:0, PLAY:1, DEAD:2 };
let state = S.MENU, holding = false;
let px, py, vy, dist, speed, score, embers, combo, comboT, shake, slowmo, deadT;
let gates = [], parts = [], pops = [], trail = [], bgSeeds = [];
let rng = null, gateIdx = 0, lastScoreGate = -1;

const G = () => H * 1.55;           // gravity
const THRUST = () => H * -2.6;      // hold force
const PX = () => W * 0.26;          // player x

function buildBg(){
  bgSeeds = [];
  const r = mulberry32(utcDayKey() ^ 0x5EED);
  for (let L = 0; L < 3; L++){
    const n = 14 + L*8, arr = [];
    for (let i = 0; i < n; i++) arr.push({ x: r(), h: .1 + r()*.32, w: .02 + r()*.05 });
    bgSeeds.push(arr);
  }
}

function reset(){
  rng = mulberry32(utcDayKey());
  gates = []; parts = []; pops = []; trail = [];
  gateIdx = 0; lastScoreGate = -1;
  px = PX(); py = H * .45; vy = 0;
  dist = 0; speed = W * .0022; score = 0; embers = 0; combo = 0; comboT = 0;
  shake = 0; slowmo = 1; deadT = 0;
  for (let i = 0; i < 6; i++) spawnGate();
}

function spawnGate(){
  // deterministic course: every call pulls from the daily rng in order
  const i = gateIdx++;
  const gapFrac = Math.max(.16, .30 - i * .0016);         // shrinks as you go
  const gap = H * gapFrac;
  const cMin = gap*.5 + H*.09, cMax = H - gap*.5 - H*.09;
  const cy = cMin + rng() * (cMax - cMin);
  const spacing = W * (.42 - Math.min(.14, i * .0025));
  const x = gates.length ? gates[gates.length-1].x + spacing : W * 1.2;
  const mode = i > 8 && rng() < Math.min(.35, .06 + i*.006) ? 1 : 0;  // 1 = drifting gate
  const amp = mode ? H * (.05 + rng()*.09) : 0;
  const ph = rng() * Math.PI * 2;
  gates.push({ x, cy, gap, i, mode, amp, ph, w: Math.max(26, W*.030), scored:false, nearDone:false });
}

/* ---------- particles ---------- */
function burst(x, y, n, col, sp){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = (Math.random()*.6+.4) * (sp || H*.6);
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: .5 + Math.random()*.6, t: 0, col, r: 2 + Math.random()*4 });
  }
}
function pop(x, y, txt, col){ pops.push({ x, y, txt, col, t: 0 }); }

/* ---------- input ---------- */
function down(e){
  if (e.target === muteBtn) return;
  if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
  if (e.type === 'keydown' && e.repeat) return;
  if (state === S.PLAY){ holding = true; sfx.flap(); }
  e.preventDefault && e.cancelable && e.preventDefault();
}
function up(e){ holding = false; }
addEventListener('keydown', down); addEventListener('keyup', up);
addEventListener('mousedown', down); addEventListener('mouseup', up);
addEventListener('touchstart', down, {passive:false}); addEventListener('touchend', up);

/* ---------- overlay ---------- */
const overlay = document.getElementById('overlay'), btnGo = document.getElementById('btnGo'),
      btnShare = document.getElementById('btnShare'), resultBlock = document.getElementById('resultBlock'),
      scoreLine = document.getElementById('scoreLine'), hud = document.getElementById('hud'),
      comboEl = document.getElementById('combo'), toast = document.getElementById('toast'),
      dailyEl = document.getElementById('daily');

function fmtReset(){ const ms = msToReset(); const h = Math.floor(ms/3.6e6), m = Math.floor(ms%3.6e6/6e4);
  return `New canyon in ${h}h ${m}m`; }
function refreshMenu(died){
  const st = store.load();
  document.getElementById('stBest').textContent = st.today;
  document.getElementById('stAll').textContent = st.all;
  document.getElementById('stStreak').textContent = (localStorage.ed_streak||0) + '🔥';
  dailyEl.textContent = fmtReset();
  if (died){
    resultBlock.classList.remove('hidden'); btnShare.classList.remove('hidden');
    const isBest = score >= st.today && score > 0;
    scoreLine.innerHTML = `You scored <span style="color:#fff;font-size:1.3em">${score}</span>` +
      (isBest ? ' — 🏆 today\'s best!' : ` · today's best ${st.today}`);
    btnGo.textContent = 'RUN IT BACK';
  }
}
btnGo.onclick = (e)=>{ e.stopPropagation(); start(); };
function start(){
  ac() && AC.resume && AC.resume();
  reset(); state = S.PLAY; overlay.classList.add('hidden'); hud.textContent = '0';
}
btnShare.onclick = async (e)=>{
  e.stopPropagation();
  const txt = `🔥 I scored ${score} on today's Ember Drift canyon — everyone flies the SAME course today. Beat me: ${location.href.split('?')[0]}`;
  try {
    if (navigator.share) await navigator.share({ text: txt });
    else { await navigator.clipboard.writeText(txt); showToast('Challenge copied — paste it anywhere'); }
  } catch(err){}
};
function showToast(t){ toast.textContent = t; toast.style.opacity = 1; setTimeout(()=>toast.style.opacity = 0, 2200); }

/* ---------- death ---------- */
function die(){
  state = S.DEAD; deadT = 0; slowmo = .25; shake = 22;
  sfx.die();
  burst(px, py, 90, '#ff9a3c', H*.9); burst(px, py, 50, '#ffd9a0', H*.5); burst(px, py, 30, '#ff3c00', H*1.2);
  const st = store.load();
  if (score > st.today && score > 0) setTimeout(()=>sfx.best(), 500);
  store.save(score);
}

/* ---------- update ---------- */
let lastT = 0;
function tick(t){
  requestAnimationFrame(tick);
  const rawDt = Math.min(.033, (t - lastT)/1000 || .016); lastT = t;
  const dt = rawDt * slowmo;

  if (state === S.PLAY || state === S.DEAD){
    if (state === S.PLAY){
      vy += (holding ? THRUST() : G()) * dt;
      vy = Math.max(-H*1.1, Math.min(H*1.25, vy));
      py += vy * dt;
      speed += dt * W * .000045;            // slow ramp
      dist += speed * dt * 1000;

      trail.push({ x: px, y: py, t: 0 });
      if (trail.length > 26) trail.shift();

      // scroll gates
      const sc = speed * dt * 1000;
      for (const g of gates) g.x -= sc;
      if (gates[0] && gates[0].x < -W*.2){ gates.shift(); spawnGate(); }

      // ceiling / floor lava
      if (py < H*.03 + 6 || py > H*.97 - 6){ die(); }

      // gate logic
      const pr = Math.max(10, H*.016);   // player radius
      for (const g of gates){
        const gy = g.mode ? g.cy + Math.sin(g.ph + t*.0016) * g.amp : g.cy;
        const inX = Math.abs(g.x - px) < g.w*.5 + pr;
        if (inX){
          const topEdge = gy - g.gap*.5, botEdge = gy + g.gap*.5;
          if (py - pr < topEdge || py + pr > botEdge){ die(); break; }
          // near-miss check (once per gate)
          if (!g.nearDone){
            const d = Math.min(py - pr - topEdge, botEdge - (py + pr));
            if (d < pr*1.6){
              g.nearDone = true; combo++; comboT = 2;
              const bonus = combo;
              embers += bonus; score += bonus;
              sfx.near(Math.min(combo,6));
              burst(px, py + (py - gy > 0 ? pr : -pr), 14, '#ffe08a', H*.35);
              pop(px, py - H*.05, `+${bonus} GRAZE${combo>1 ? ' x'+combo : ''}`, '#ffe08a');
            }
          }
        }
        if (!g.scored && g.x + g.w*.5 < px - pr){
          g.scored = true; score++; sfx.gate();
          if (!g.nearDone){ combo = 0; }
          hud.textContent = score;
        }
      }
      if (comboT > 0){ comboT -= dt; comboEl.style.opacity = 1;
        comboEl.textContent = combo > 1 ? `🔥 GRAZE CHAIN x${combo}` : '✨ graze!';
      } else comboEl.style.opacity = 0;
    } else {
      // dead: slow-mo out then menu
      deadT += rawDt; slowmo = Math.min(1, slowmo + rawDt*.4);
      if (deadT > 1.4){ state = S.MENU; overlay.classList.remove('hidden'); refreshMenu(true); }
    }
    for (const g of gates) if (g.mode) g.gy = g.cy + Math.sin(g.ph + t*.0016) * g.amp;
  }

  // particles / popups always update
  for (let i = parts.length-1; i >= 0; i--){ const p = parts[i]; p.t += dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += H*.9*dt; if (p.t > p.life) parts.splice(i,1); }
  for (let i = pops.length-1; i >= 0; i--){ const p = pops[i]; p.t += dt; if (p.t > 1) pops.splice(i,1); }
  for (const tr of trail) tr.t += dt;
  if (shake > 0) shake = Math.max(0, shake - rawDt*40);

  render(t);
}

/* ---------- render ---------- */
function render(t){
  cx.save();
  if (shake > 0) cx.translate((Math.random()-.5)*shake*DPR, (Math.random()-.5)*shake*DPR);

  // sky: deep ember gradient
  const bg = cx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, '#170608'); bg.addColorStop(.55, '#2b0a06'); bg.addColorStop(1, '#4a1204');
  cx.fillStyle = bg; cx.fillRect(-40,-40,W+80,H+80);

  // parallax silhouette ridges
  const cols = ['#20070a', '#33100a', '#571b08'];
  bgSeeds.forEach((layer, L)=>{
    const sp = (dist * (L+1) * .04) / W;
    cx.fillStyle = cols[L];
    for (const m of layer){
      let mx = ((m.x - sp) % 1 + 1) % 1 * (W*1.2) - W*.1;
      const mh = m.h * H, mw = m.w * W * (2.4 - L*.5);
      cx.beginPath(); cx.moveTo(mx - mw, H); cx.lineTo(mx, H - mh - L*H*.07); cx.lineTo(mx + mw, H); cx.fill();
    }
  });

  // floor lava + ceiling smoke
  const lg = cx.createLinearGradient(0, H*.94, 0, H);
  lg.addColorStop(0, 'rgba(255,90,10,0)'); lg.addColorStop(1, 'rgba(255,120,20,.85)');
  cx.fillStyle = lg; cx.fillRect(0, H*.94, W, H*.06);
  const tg = cx.createLinearGradient(0, 0, 0, H*.05);
  tg.addColorStop(0, 'rgba(0,0,0,.8)'); tg.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = tg; cx.fillRect(0, 0, W, H*.05);

  // gates: molten rock pillars with glow edge
  for (const g of gates){
    const gy = (g.mode ? (g.gy ?? g.cy) : g.cy);
    const topH = gy - g.gap*.5, botY = gy + g.gap*.5;
    cx.save();
    cx.shadowColor = '#ff5a00'; cx.shadowBlur = 26*DPR;
    const rock = cx.createLinearGradient(g.x - g.w, 0, g.x + g.w, 0);
    rock.addColorStop(0, '#3a0d04'); rock.addColorStop(.5, '#7a2a08'); rock.addColorStop(1, '#2c0903');
    cx.fillStyle = rock;
    cx.fillRect(g.x - g.w*.5, -10, g.w, topH + 10);
    cx.fillRect(g.x - g.w*.5, botY, g.w, H - botY + 10);
    // glowing rims at the gap
    cx.fillStyle = '#ffb340';
    cx.fillRect(g.x - g.w*.5, topH - 4*DPR, g.w, 4*DPR);
    cx.fillRect(g.x - g.w*.5, botY, g.w, 4*DPR);
    cx.restore();
  }

  if (state !== S.MENU || score > 0){
    // trail
    for (let i = 0; i < trail.length; i++){
      const tr = trail[i], a = i / trail.length;
      cx.beginPath();
      cx.fillStyle = `rgba(255,${140 + a*90|0},${40 + a*80|0},${a*.5})`;
      cx.arc(tr.x - (trail.length - i) * speed*220, tr.y, Math.max(1, H*.012*a), 0, 7);
      cx.fill();
    }
    // player ember orb
    if (state === S.PLAY || (state === S.DEAD && deadT < .1)){
      const pr = Math.max(10, H*.016);
      cx.save();
      cx.shadowColor = '#ffd080'; cx.shadowBlur = 34*DPR;
      const og = cx.createRadialGradient(px, py, 0, px, py, pr*1.7);
      og.addColorStop(0, '#fff8e8'); og.addColorStop(.4, '#ffc65e'); og.addColorStop(1, 'rgba(255,90,10,0)');
      cx.fillStyle = og; cx.beginPath(); cx.arc(px, py, pr*1.7, 0, 7); cx.fill();
      cx.fillStyle = '#fff3d6'; cx.beginPath(); cx.arc(px, py, pr*.62, 0, 7); cx.fill();
      cx.restore();
    }
  }

  // particles
  for (const p of parts){
    const a = 1 - p.t / p.life;
    cx.globalAlpha = a; cx.fillStyle = p.col;
    cx.beginPath(); cx.arc(p.x, p.y, p.r * DPR * a, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;

  // score pops
  cx.textAlign = 'center';
  for (const p of pops){
    cx.globalAlpha = 1 - p.t;
    cx.fillStyle = p.col; cx.font = `bold ${Math.round(H*.032)}px Segoe UI, sans-serif`;
    cx.shadowColor = p.col; cx.shadowBlur = 14*DPR;
    cx.fillText(p.txt, p.x, p.y - p.t * H*.07);
    cx.shadowBlur = 0;
  }
  cx.globalAlpha = 1;
  cx.restore();
}
/* debug/testing hook: lets an automated pilot read state (no gameplay effect) */
window.__dbg = () => state !== S.PLAY ? { state } : {
  state, py, vy, score,
  next: (gates.find(g => g.x + g.w*.5 > px - 12) || {}) };

buildBg();
refreshMenu(false);
setInterval(()=>{ if (state === S.MENU) dailyEl.textContent = fmtReset(); }, 30000);
requestAnimationFrame(tick);

/* CrazyGames/Poki SDK hooks land here when we submit:
   - sdk.gameplayStart() in start(), sdk.gameplayStop() in die()
   - rewarded ad = "second chance" continue (one per run)          */
</script>
</body>
</html>
